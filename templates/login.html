<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | Resume Tracking System</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

<style>

body{
height:100vh;
margin:0;
font-family:"Segoe UI", Arial, sans-serif;

background-image:url("{{ url_for('static', filename='12.jpg') }}");
background-size:cover;
background-position:center;
background-repeat:no-repeat;

display:flex;
align-items:center;
justify-content:flex-start;
padding-left:120px;
}

/* Navbar */

.navbar-custom{
position:fixed;
top:0;
left:0;
width:100%;
background:#0d0d0d;
padding:10px 40px;
z-index:1000;
}

.logo{
height:40px;
margin-right:10px;
}


.navbar-brand{
color:white;
font-size:22px;
font-weight:600;
display:flex;
align-items:center;
}

.nav-btn{
margin-left:10px;
}

/* Blue Button */

.btn-blue{
background:#184579;
color:white;
border:none;
}

.btn-blue:hover{
background:#0f3359;
color:white;
}

/* Form */
.form-box{
width:380px;
padding:40px;
border-radius:12px;
background:rgba(255,255,255,0.9);
box-shadow:0 10px 35px rgba(0,0,0,0.4);
}

.form-control{
padding:12px;
border-radius:6px;
}

.btn-custom{
background:#184579;
color:white;
padding:12px;
border-radius:6px;
}

.btn-custom:hover{
background:#0f3359;
}

.link-style{
color:#184579;
font-weight:500;
text-decoration:none;
}

.link-style:hover{
text-decoration:underline;
}

</style>

</head>

<body>


<!-- Navbar -->

<nav class="navbar navbar-expand-lg navbar-dark navbar-custom">

<div class="container-fluid">

<a class="navbar-brand" href="#">
<img src="{{ url_for('static', filename='Logo.jpg') }}" class="logo">
Resume Tracking System
</a>

<div class="ms-auto">

<a href="/" class="btn btn-outline-light nav-btn">Home</a>
<a href="/login" class="btn btn-light nav-btn">Login</a>
<a href="/register" class="btn btn-light nav-btn">Register</a>
</div>
</div>
</nav>

<!-- Login Form -->

<div class="form-box">

<h3 class="text-center mb-4">Login</h3>

<form method="POST">

<div class="mb-3">
<input type="email" name="email" class="form-control" placeholder="Email Address" required>
</div>

<div class="mb-3">
<input type="password" name="password" class="form-control" placeholder="Password" required>
</div>

<button class="btn btn-custom w-100">Login</button>

</form>

<p class="text-center mt-3">
Don't have an account?
<a href="/register" class="link-style">Register</a>
</p>

</div>

</body>
</html>
