<!DOCTYPE html>
<html lang="en">
<head>

<title>Upload Resume</title>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

<style>

/* Background */

body{
margin:0;
height:100vh;
font-family:"Segoe UI", Arial, sans-serif;

background-image:
linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)),
url("{{ url_for('static', filename='Dashboard.jpg') }}");

background-size:cover;
background-position:center;
background-repeat:no-repeat;
}

/* Navbar */

.navbar{
background:black;
padding:12px 30px;
}

.logo{
height:40px;
margin-right:10px;
}

.navbar-brand{
display:flex;
align-items:center;
color:white !important;
font-size:22px;
font-weight:600;
}

/* Navbar Buttons */

.nav-btn{
border-radius:8px;
padding:6px 18px;
font-weight:500;
margin-left:8px;
}

.btn-outline-light:hover{
background:white;
color:black;
}

.btn-light:hover{
background:#ddd;
}

/* Glass Form Box */

.form-box{

background:rgba(255,255,255,0.1);
backdrop-filter: blur(12px);

border-radius:15px;
border:1px solid rgba(255,255,255,0.2);

padding:20px;

max-width:500px;
margin:100px auto;

color:white;

box-shadow:0 8px 30px rgba(0,0,0,0.4);
}

/* Heading */

.form-box h2{
font-weight:800;
text-align:center;
margin-bottom:25px;
}

/* Input fields */

.form-control{
background:rgba(255,255,255,0.9);
border:none;
border-radius:8px;
}

/* Upload field */

input[type="file"]{
padding:10px;
}

/* Button */

.btn-custom{

background:#112056;
color:white;

font-size:18px;
font-weight:bold;

padding:12px;

border-radius:8px;
border:none;
}

.btn-custom:hover{
background:white;
color:rgb(33, 50, 107);
}

/* Label */

label{
font-weight:600;
margin-bottom:5px;
}

</style>

</head>

<body>

<!-- Navbar -->

<nav class="navbar navbar-expand-lg navbar-dark">

<div class="container-fluid">

<!-- Logo -->
<a class="navbar-brand" href="/">
<img src="{{ url_for('static', filename='Logo.jpg') }}" class="logo">
Resume Tracking System
</a>

<!-- Mobile Toggle -->
<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
<span class="navbar-toggler-icon"></span>
</button>

<!-- Right Side Buttons -->
<div class="collapse navbar-collapse justify-content-end" id="navbarNav">

<a href="/" class="btn btn-outline-light nav-btn">Home</a>
<a href="/login" class="btn btn-light nav-btn">Login</a>
<a href="/register" class="btn btn-light nav-btn">Register</a>

</div>

</div>

</nav>

<!-- Form -->

<div class="container">

<div class="form-box">

<h2>Resume Analyzer</h2>

<form action="/upload" method="POST" enctype="multipart/form-data">

<div class="mb-3">
<label>Upload Resume</label>
<input type="file" name="resume" class="form-control" required>
</div>

<div class="mb-3">
<label>Job Description</label>
<textarea name="jd" rows="6" class="form-control"
placeholder="Paste the job description here..." required></textarea>
</div>

<button class="btn btn-custom w-100">
Analyze Resume
</button>

</form>

</div>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
